name: 'Terraform Validation & Quality Checks'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'azure-landing-zone-deployment/**'
      - '.github/workflows/terraform-validation.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'azure-landing-zone-deployment/**'
      - '.github/workflows/terraform-validation.yml'

permissions:
  contents: read

jobs:
  # ============================================================================
  # JOB 1: Canonical Code Formatting Check
  # ============================================================================
  terraform-fmt:
    name: 'Terraform Format Check'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Terraform CLI'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: 'Run terraform fmt -check'
        run: |
          echo "==> Verifying Terraform canonical formatting..."
          cd azure-landing-zone-deployment || true
          terraform fmt -check -diff -recursive .

  # ============================================================================
  # JOB 2: Validate Reusable Terraform Modules
  # ============================================================================
  validate-modules:
    name: 'Validate Module: ${{ matrix.module }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - modules/resource_group
          - modules/virtual_network
          - modules/subnet
          - modules/network_security_group
          - modules/key_vault
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Terraform CLI'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: 'Terraform Init (Offline)'
        working-directory: ${{ (hashFiles('azure-landing-zone-deployment/**') != '' && 'azure-landing-zone-deployment/') || '' }}${{ matrix.module }}
        run: terraform init -backend=false

      - name: 'Terraform Validate'
        working-directory: ${{ (hashFiles('azure-landing-zone-deployment/**') != '' && 'azure-landing-zone-deployment/') || '' }}${{ matrix.module }}
        run: terraform validate

  # ============================================================================
  # JOB 3: Validate Multi-Environment Topologies
  # ============================================================================
  validate-environments:
    name: 'Validate Environment: ${{ matrix.env }}'
    runs-on: ubuntu-latest
    needs: validate-modules
    strategy:
      fail-fast: false
      matrix:
        env:
          - environments/dev
          - environments/test
          - environments/prod
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Setup Terraform CLI'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: 'Terraform Init (Offline)'
        working-directory: ${{ (hashFiles('azure-landing-zone-deployment/**') != '' && 'azure-landing-zone-deployment/') || '' }}${{ matrix.env }}
        run: terraform init -backend=false

      - name: 'Terraform Validate'
        working-directory: ${{ (hashFiles('azure-landing-zone-deployment/**') != '' && 'azure-landing-zone-deployment/') || '' }}${{ matrix.env }}
        run: terraform validate

  # ============================================================================
  # JOB 4: Static Security & Misconfiguration Analysis (Checkov)
  # ============================================================================
  security-scan:
    name: 'Checkov Security Scan'
    runs-on: ubuntu-latest
    needs: validate-environments
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Run Checkov IaC Security Scanner'
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true # Soft fail allows learners to review findings without breaking the educational PR
